# Prometheus — storagedb metrikalarini yig'adi.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Gateway (per-loyiha request/latency/db gauge)
  - job_name: storagedb-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]

  # Server CPU/RAM/disk (node-exporter)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Postgres (postgres-exporter)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
