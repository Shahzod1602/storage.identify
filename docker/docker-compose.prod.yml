# Production stack: Caddy (HTTPS) + Postgres + Gateway + Studio.
# Ishga tushirish:
#   ./scripts/gen-secrets.sh >> .env   # secretlarni generatsiya qiling
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Muhim: .env'da NODE_ENV=production, PLATFORM_SECRET, PLATFORM_ADMIN_TOKEN,
# POSTGRES_PASSWORD, API_DOMAIN, STUDIO_DOMAIN, GATEWAY_CORS_ORIGINS ni o'rnating!
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - gateway
      - studio
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN kerak (masalan api.misol.uz)}
      STUDIO_DOMAIN: ${STUDIO_DOMAIN:?STUDIO_DOMAIN kerak}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: platform
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/platform
      PROJECTS_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      PLATFORM_SECRET: ${PLATFORM_SECRET:?PLATFORM_SECRET kerak}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:?PLATFORM_ADMIN_TOKEN kerak}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:?GATEWAY_CORS_ORIGINS kerak (domenlaringiz)}
      STORAGE_DIR: /data/storage
    # Port faqat ichki tarmoqda — tashqariga Caddy chiqaradi (HTTPS).
    expose:
      - "8000"
    volumes:
      - storage-data:/data/storage

  studio:
    build:
      context: ../apps/studio
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      NEXT_PUBLIC_GATEWAY_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
    expose:
      - "3001"

volumes:
  postgres-data:
  storage-data:
  caddy-data:
  caddy-config:
