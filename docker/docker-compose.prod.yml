# Production stack: Postgres + Gateway + Studio.
# Ishga tushirish:
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Muhim: .env ichidagi PLATFORM_SECRET, PLATFORM_ADMIN_TOKEN, POSTGRES_PASSWORD
# ni albatta uzun tasodifiy qiymatlarga o'zgartiring!
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: platform
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/platform
      PROJECTS_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      PLATFORM_SECRET: ${PLATFORM_SECRET:?PLATFORM_SECRET kerak}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:?PLATFORM_ADMIN_TOKEN kerak}
      STORAGE_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - storage-data:/data/storage

  studio:
    build:
      context: ../apps/studio
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      NEXT_PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8000}
      NEXT_PUBLIC_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
    ports:
      - "3001:3001"

volumes:
  postgres-data:
  storage-data:
