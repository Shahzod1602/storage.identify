# Server deploy — tayyor image'larni GHCR'dan PULL qiladi + Caddy (HTTPS).
# Bitta domen ostida: dashboard root'da, API /v1·/admin yo'llarида.
# Server .env'da: DOMAIN, PUBLIC_URL, POSTGRES_PASSWORD, PLATFORM_SECRET, PLATFORM_ADMIN_TOKEN.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [gateway, studio]
    environment:
      DOMAIN: ${DOMAIN:?kerak}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.server:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?kerak}
      POSTGRES_DB: platform
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    image: ghcr.io/shahzod1602/storagedb-gateway:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/platform
      PROJECTS_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      PLATFORM_SECRET: ${PLATFORM_SECRET:?kerak}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:?kerak}
      GATEWAY_CORS_ORIGINS: ${PUBLIC_URL:?kerak}
      STORAGE_DIR: /data/storage
    expose:
      - "8000"
    volumes:
      - storage-data:/data/storage

  studio:
    image: ghcr.io/shahzod1602/storagedb-studio:latest
    restart: unless-stopped
    depends_on: [gateway]
    expose:
      - "3001"

volumes:
  postgres-data:
  storage-data:
  caddy-data:
  caddy-config:
